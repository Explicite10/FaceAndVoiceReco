<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Prueba de vida · Panel</title>
    <meta name="theme-color" content="#072146" />
    <link rel="icon" type="image/png" href="/static/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/panel.css" />
  </head>
  <body>
    <main class="center-page">
      <div class="card auth-card">
        <img class="auth-logo" src="/static/logo.png" alt="" />
        <h1>Prueba de vida</h1>
        <p class="sub">Inicia sesión para ver el panel administrativo.</p>
        <form method="post" action="/login" autocomplete="on">
          {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
          <div class="field">
            <label for="email">Correo</label>
            <input class="input" type="email" id="email" name="email" value="{{ email }}" required maxlength="200"
                   autocomplete="username" inputmode="email" autofocus />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input class="input" type="password" id="password" name="password" required maxlength="200"
                   autocomplete="current-password" />
          </div>
          <button class="btn btn-primary btn-block" type="submit">Entrar</button>
        </form>
        <p class="fine">Acceso solo para personal autorizado.</p>
      </div>
    </main>
  </body>
</html>
