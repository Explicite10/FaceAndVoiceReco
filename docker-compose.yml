# Levantar o actualizar en el servidor:
#   docker compose up -d --build
#
# restart: always hace que el contenedor arranque solo al prender el servidor,
# siempre que el servicio de Docker tambien arranque con el sistema:
#   sudo systemctl enable docker

services:
  api:
    build: .
    image: face-voice-reco
    container_name: face-voice-reco
    restart: always
    env_file: .env
    ports:
      - "${API_PORT:-7860}:7860"
